name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/dev/alx/screenshift app/src/main/assets app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://api.xposed.info/")
              }
          }
          rootProject.name = "ScreenShift"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }

          android {
              namespace = "dev.alx.screenshift"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.alx.screenshift"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ScreenShift"
                  android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription"
                      android:value="Піднімає зменшену картинку до верху робочої зони екрана" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/arrays.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>android</item>
              </string-array>
          </resources>
          EOF
          cat > app/src/main/assets/xposed_init <<'EOF'
          dev.alx.screenshift.Hook
          EOF
          cat > app/src/main/java/dev/alx/screenshift/Hook.java <<'EOF'
          package dev.alx.screenshift;

          import android.graphics.Rect;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
              static final String TAG = "ScreenShift";

              // Безпечний метод читання налаштувань без помилок компіляції
              private static int getSysProp(String key, int defVal) {
                  try {
                      Class<?> clazz = Class.forName("android.os.SystemProperties");
                      return (Integer) clazz.getMethod("getInt", String.class, int.class).invoke(null, key, defVal);
                  } catch (Exception e) {
                      return defVal;
                  }
              }

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if (!"android".equals(lpparam.packageName)) return;
                  try {
                      Class<?> dd = XposedHelpers.findClass(
                              "com.android.server.display.DisplayDevice", lpparam.classLoader);
                      XposedBridge.hookAllMethods(dd, "setProjectionLocked", new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) {
                              try {
                                  shift(param);
                              } catch (Throwable t) {
                                  XposedBridge.log(TAG + ": shift failed: " + t);
                              }
                          }
                      });
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": hook failed: " + t);
                  }
              }

              private static void shift(XC_MethodHook.MethodHookParam param) {
                  Object[] a = param.args;
                  Rect layerRect = null;
                  Rect dispRect = null;
                  
                  // Знаходимо логічний екран (layerStackRect) і фізичну зону (displayRect)
                  for (int i = 0; i < a.length; i++) {
                      if (a[i] instanceof Rect) {
                          if (layerRect == null) {
                              layerRect = (Rect) a[i];
                          } else {
                              dispRect = (Rect) a[i];
                              break;
                          }
                      }
                  }
                  if (dispRect == null || layerRect == null) return;

                  // Ігноруємо, якщо екран повернуто (ландшафтний режим)
                  if (a.length > 1 && a[1] instanceof Integer && (Integer) a[1] != 0) return;

                  Object info = XposedHelpers.callMethod(param.thisObject, "getDisplayDeviceInfoLocked");
                  if (info == null) return;
                  int physW = XposedHelpers.getIntField(info, "width");
                  int physH = XposedHelpers.getIntField(info, "height");

                  // Перевіряємо, чи це внутрішня матриця смартфона (за замовчуванням 1440x3120)
                  int targetW = getSysProp("persist.sys.shift.pw", 1440);
                  int targetH = getSysProp("persist.sys.shift.ph", 3120);
                  if (physW != targetW || physH != targetH) return;

                  // Зчитуємо фізичні межі (displayRect) — куди розтягнути картинку
                  int dispL = getSysProp("persist.sys.shift.dl", 0);
                  int dispT = getSysProp("persist.sys.shift.dt", 0);
                  int dispR = getSysProp("persist.sys.shift.dr", targetW);
                  int dispB = getSysProp("persist.sys.shift.db", 1510);

                  dispRect.set(dispL, dispT, dispR, dispB);
                  
                  // Якщо потрібно форсувати логічний розмір екрана прямо тут (замість wm size)
                  if (getSysProp("persist.sys.shift.force_layer", 0) == 1) {
                      int layerL = getSysProp("persist.sys.shift.ll", 0);
                      int layerT = getSysProp("persist.sys.shift.lt", 0);
                      int layerR = getSysProp("persist.sys.shift.lr", targetW);
                      int layerB = getSysProp("persist.sys.shift.lb", targetH);
                      layerRect.set(layerL, layerT, layerR, layerB);
                  }
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenShift-apk
          path: app/build/outputs/apk/debug/*.apk
          
